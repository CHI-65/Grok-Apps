<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<title>P!NK NA 2026 – Digital Tour Book</title>
<style>
  body { margin:0; font-family:Georgia, 'Times New Roman', serif; background:#fff; color:#111; }
  #cover { position:fixed; inset:0; background:#000 url('cover-page1.png') center/cover no-repeat; display:flex; align-items:flex-end; justify-content:center; padding-bottom:40px; z-index:100; }
  #cover button { padding:14px 28px; background:#fff; color:#e10600; border:none; border-radius:6px; font-weight:600; font-family:system-ui; }
  header { background:#111; color:#fff; padding:12px 16px; position:sticky; top:0; z-index:20; font-family:system-ui; }
  .nav { display:flex; background:#eee; border-bottom:1px solid #ccc; }
  .nav button { flex:1; padding:10px; background:none; border:none; }
  .nav button.active { background:#fff; border-bottom:2px solid #e10600; }
  .content { padding:16px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:13px; }
  .cal-grid div { padding:8px 2px; border:1px solid #ddd; min-height:48px; cursor:pointer; }
  .cal-grid .dow { background:#333; color:#fff; font-weight:600; border:none; cursor:default; }
  .cal-grid .filled { background:#ffe6e6; font-weight:600; }
  .daysheet h2 { text-align:center; margin:8px 0; }
  .daysheet .section { margin:14px 0; }
  .daysheet .label { font-weight:700; font-size:13px; letter-spacing:1px; margin-bottom:4px; }
  .hidden { display:none !important; }
  .version { font-size:11px; opacity:.6; }
</style>
</head>
<body>
<div id="cover">
  <button onclick="enter()">Open Tour Book</button>
</div>
<header>
  <div>P!NK • Summer Carnival 2026</div>
  <div class="version">v1.2</div>
</header>
<div class="nav">
  <button class="active" onclick="show('calendar')">Calendar</button>
  <button onclick="show('contacts')">Contacts</button>
</div>
<div id="calendar" class="content">
  <div style="text-align:center;font-weight:700;margin-bottom:8px">OCTOBER 2026</div>
  <div class="cal-grid" id="octCal"></div>
  <div style="text-align:center;font-weight:700;margin:16px 0 8px">NOVEMBER 2026</div>
  <div class="cal-grid" id="novCal"></div>
</div>
<div id="contacts" class="content hidden">
  <h3>A Party</h3>
  <div>Nik Tischler • A Party TM</div>
  <h3>Local</h3>
  <div>Ryan Vangel • Promoter • <a href="tel:+16176493226">617-649-3226</a></div>
  <div>Mike Marchetti • Prod Rep • <a href="tel:+15083317599">508-331-7599</a></div>
</div>
<div id="daypage" class="content daysheet hidden">
  <h2 id="daytitle"></h2>
  <div id="daybody"></div>
</div>
<script>
function enter() { document.getElementById('cover').style.display='none'; }

const filled = {
  '2026-10-31': 'Show 1 • Fenway',
  '2026-11-01': 'Show 2 • Fenway',
  '2026-11-02': 'Travel • New York',
  '2026-11-04': 'Show • Citi Field',
  '2026-11-06': 'Show • PNC Park',
  '2026-11-08': 'Show • Nationals',
  '2026-11-10': 'Today • Day Off',
  '2026-11-11': 'Show • Nationals',
  '2026-11-13': 'Show • Target Field',
  '2026-11-16': 'Show • Wrigley',
  '2026-11-18': 'Show • Milwaukee',
  '2026-11-20': 'Show • Detroit'
};

function buildCal(year, month, containerId) {
  const cal = document.getElementById(containerId);
  const first = new Date(year, month, 1);
  const start = first.getDay();
  const days = new Date(year, month+1, 0).getDate();
  let html = '<div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>';
  for (let i = 0; i < start; i++) html += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const label = filled[key] || '';
    const cls = filled[key] ? 'filled' : '';
    html += `<div class="${cls}" onclick="openDay('${key}')">${d}${label ? '<br>'+label : ''}</div>`;
  }
  cal.innerHTML = html;
}

function openDay(key) {
  const date = new Date(key + 'T12:00:00');
  const title = date.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }).toUpperCase();
  document.getElementById('daytitle').textContent = title;
  let body = '';
  if (filled[key]) {
    body = `<div class="section"><div class="label">STATUS</div>${filled[key]}</div>
            <div class="section"><div class="label">NOTES</div>Full day sheet data can be added here.</div>`;
  } else {
    body = `<div class="section"><div class="label">STATUS</div>No data yet</div>
            <div class="section"><div class="label">NOTES</div>This day is a placeholder. Content can be added later.</div>`;
  }
  document.getElementById('daybody').innerHTML = body;
  show('daypage');
}

function show(id) {
  document.querySelectorAll('.content').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if (id === 'calendar' || id === 'contacts') event.target.classList.add('active');
}

buildCal(2026, 9, 'octCal');
buildCal(2026, 10, 'novCal');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
