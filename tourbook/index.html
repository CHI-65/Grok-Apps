<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<link rel="manifest" href="manifest.webmanifest">
<title>P!NK NA 2026 – Digital Tour Book</title>
<style>
  body { margin:0; background:#fff; color:#111; font-family:Georgia, 'Times New Roman', serif; }
  #cover { position:fixed; inset:0; background:#000 url('cover-page1.png') center/cover no-repeat; display:flex; align-items:flex-end; justify-content:center; padding-bottom:40px; z-index:100; }
  #cover button { padding:14px 28px; background:#fff; color:#e10600; border:none; border-radius:6px; font-weight:600; font-family:system-ui; }
  header { background:#111; color:#fff; padding:10px 16px; position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; font-family:system-ui; }
  .nav button { background:#333; color:#fff; border:none; padding:8px 12px; margin:0 4px; border-radius:6px; }
  .nav button.active { background:#e10600; }
  #banner { background:#e10600; color:#fff; padding:10px 16px; text-align:center; font-family:system-ui; display:none; }
  #banner button { background:#fff; color:#e10600; border:none; padding:6px 12px; border-radius:4px; margin-left:10px; font-weight:600; }
  #pageview { height:calc(100vh - 50px); overflow:auto; background:#eee; }
  #pageview img { width:100%; display:block; }
  .controls { background:#111; color:#fff; padding:8px 16px; display:flex; justify-content:space-between; align-items:center; font-family:system-ui; }
  .content { padding:20px 16px; min-height:calc(100vh - 50px); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; font-size:12px; }
  .cal-grid div { padding:6px 2px; border:1px solid #ddd; min-height:44px; cursor:pointer; }
  .cal-grid .dow { background:#333; color:#fff; font-weight:600; border:none; }
  .cal-grid .filled { background:#ffe6e6; font-weight:600; }
  .daysheet h2 { text-align:center; margin:4px 0 12px; font-size:18px; letter-spacing:1px; }
  .daysheet .section { margin:16px 0; }
  .daysheet .label { font-weight:700; font-size:12px; letter-spacing:1.5px; margin-bottom:6px; border-bottom:1px solid #111; padding-bottom:2px; }
  .empty { color:#999; font-style:italic; }
  .hidden { display:none !important; }
  .version { font-size:11px; opacity:.6; }
</style>
</head>
<body>
<div id="cover">
  <button onclick="enter()">Open Tour Book</button>
</div>
<div id="banner">New version available <button onclick="location.reload(true)">Refresh</button></div>
<header>
  <div>P!NK • 2026 <span class="version" id="ver">v1.8</span></div>
  <div class="nav">
    <button class="active" onclick="showView('pages')">Pages</button>
    <button onclick="showView('calendar')">Calendar</button>
    <button onclick="location.reload(true)">Refresh</button>
  </div>
</header>
<div id="pages">
  <div id="pageview"><img id="pageimg" src="pages/p-002.png"></div>
  <div class="controls">
    <button onclick="prevPage()">Prev</button>
    <span id="pagenum">Page 2</span>
    <button onclick="nextPage()">Next</button>
  </div>
</div>
<div id="calendar" class="content hidden">
  <div style="text-align:center;font-weight:700;margin-bottom:8px;letter-spacing:1px">OCTOBER 2026</div>
  <div class="cal-grid" id="octCal"></div>
  <div style="text-align:center;font-weight:700;margin:16px 0 8px;letter-spacing:1px">NOVEMBER 2026</div>
  <div class="cal-grid" id="novCal"></div>
</div>
<div id="daypage" class="content daysheet hidden">
  <h2 id="daytitle"></h2>
  <div id="daybody"></div>
  <div style="text-align:center;margin-top:24px"><button onclick="showView('calendar')" style="padding:10px 20px">Back to Calendar</button></div>
</div>
<script>
function enter() { document.getElementById('cover').style.display='none'; }

const CURRENT = '1.8';
fetch('https://chi-65.github.io/Grok-Apps/tourbook/index.html?v=' + Date.now())
  .then(r => r.text())
  .then(html => {
    const m = html.match(/v([0-9.]+)/);
    if (m && m[1] !== CURRENT) {
      document.getElementById('banner').style.display = 'block';
    }
  }).catch(()=>{});

let currentPage = 2;
const maxPage = 42;
let touchStartX = 0;

document.getElementById('pageview').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('pageview').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 50) prevPage();
  if (dx < -50) nextPage();
});

function showPage() {
  document.getElementById('pageimg').src = 'pages/p-' + String(currentPage).padStart(3,'0') + '.png';
  document.getElementById('pagenum').textContent = 'Page ' + currentPage;
}
function prevPage() { if (currentPage > 2) { currentPage--; showPage(); } }
function nextPage() { if (currentPage < maxPage) { currentPage++; showPage(); } }

const filled = {
  '2026-10-31': { status: 'Show 1 of 2 • Fenway Park', hotels: 'A: Four Seasons Boylston<br>B: The Ritz-Carlton<br>C: Commonwealth Hotel', venue: 'Fenway Park<br>4 Yawkey Way, Boston, MA', schedule: 'Doors 5:00 PM<br>P!NK 8:30–10:30 PM<br>Curfew 10:30 PM' },
  '2026-11-01': { status: 'Show 2 of 2 • Fenway Park', hotels: 'A & B same as Oct 31<br>C moves after show', venue: 'Fenway Park', schedule: 'Same structure • Curfew 10:30 PM' },
  '2026-11-02': { status: 'Travel Day • New York', hotels: 'A: Four Seasons New York<br>B: The Plaza<br>C: Ace Hotel Brooklyn', venue: '—', schedule: 'No show' },
  '2026-11-04': { status: 'Show • Citi Field', hotels: 'Same as Nov 2', venue: 'Citi Field, Queens', schedule: 'Doors 5:00 PM • Curfew 11:00 PM' },
  '2026-11-06': { status: 'Show • PNC Park', hotels: 'A: Fairmont Pittsburgh<br>B: Kimpton Hotel Monaco<br>C: Hilton Garden Inn', venue: 'PNC Park', schedule: 'Doors 5:30 PM • Curfew 10:45 PM' },
  '2026-11-08': { status: 'Show • Nationals Park', hotels: 'A: The Willard<br>B: Hotel Washington<br>C: Hampton Inn', venue: 'Nationals Park', schedule: 'Doors 5:00 PM • Curfew 10:30 PM' },
  '2026-11-10': { status: 'Today • Day Off', hotels: 'Same as Nov 8', venue: '—', schedule: 'Day off. Load-in tomorrow.' },
  '2026-11-11': { status: 'Show • Nationals Park', hotels: 'Same as Nov 8', venue: 'Nationals Park', schedule: 'Doors 5:00 PM • Curfew 10:30 PM' },
  '2026-11-13': { status: 'Show • Target Field', hotels: 'A: Four Seasons Minneapolis<br>B: The Depot<br>C: Hilton Minneapolis', venue: 'Target Field', schedule: 'Doors 5:00 PM • Curfew 10:30 PM' },
  '2026-11-16': { status: 'Show • Wrigley Field', hotels: 'A: The Langham<br>B: Hotel EMC2<br>C: Hampton Inn', venue: 'Wrigley Field', schedule: 'Doors 5:00 PM • Curfew 10:30 PM' },
  '2026-11-18': { status: 'Show • American Family Field', hotels: 'A: The Pfister<br>B: Kimpton Journeyman<br>C: Hilton Milwaukee', venue: 'American Family Field', schedule: 'Doors 5:00 PM • Curfew 10:30 PM' },
  '2026-11-20': { status: 'Show • Comerica Park', hotels: 'A: The Shinola Hotel<br>B: Detroit Foundation Hotel<br>C: Hampton Inn', venue: 'Comerica Park', schedule: 'Doors 5:00 PM • Curfew 10:30 PM' }
};

function buildCal(year, month, containerId) {
  const cal = document.getElementById(containerId);
  const first = new Date(year, month, 1);
  const start = first.getDay();
  const days = new Date(year, month+1, 0).getDate();
  let html = '<div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>';
  for (let i = 0; i < start; i++) html += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const label = filled[key] ? filled[key].status.split('•')[0].trim() : '';
    const cls = filled[key] ? 'filled' : '';
    html += `<div class="${cls}" onclick="openDay('${key}')">${d}${label ? '<br>'+label : ''}</div>`;
  }
  cal.innerHTML = html;
}

function openDay(key) {
  const date = new Date(key + 'T12:00:00');
  const title = date.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }).toUpperCase();
  document.getElementById('daytitle').textContent = title;
  const data = filled[key] || {};
  const body = `
    <div class="section"><div class="label">STATUS</div>${data.status || '<span class="empty">—</span>'}</div>
    <div class="section"><div class="label">HOTELS</div>${data.hotels || '<span class="empty">—</span>'}</div>
    <div class="section"><div class="label">VENUE</div>${data.venue || '<span class="empty">—</span>'}</div>
    <div class="section"><div class="label">SCHEDULE</div>${data.schedule || '<span class="empty">—</span>'}</div>
    <div class="section"><div class="label">NOTES</div>${data.notes || '<span class="empty">—</span>'}</div>
  `;
  document.getElementById('daybody').innerHTML = body;
  showView('daypage');
}

function showView(id) {
  document.getElementById('pages').classList.add('hidden');
  document.getElementById('calendar').classList.add('hidden');
  document.getElementById('daypage').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if (id === 'pages' || id === 'calendar') event.target.classList.add('active');
}

buildCal(2026, 9, 'octCal');
buildCal(2026, 10, 'novCal');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
