<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<title>P!NK NA 2026 – Digital Tour Book</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:system-ui; }
  #viewer { height:100vh; display:flex; flex-direction:column; }
  #pages { flex:1; overflow:auto; background:#222; }
  #pages img { width:100%; display:block; }
  .controls { background:#000; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }
  .controls button { background:#333; color:#fff; border:none; padding:8px 14px; border-radius:6px; }
  .page-num { font-size:14px; }
  .version { position:fixed; bottom:60px; right:12px; font-size:11px; opacity:.5; }
  input[type=number] { width:60px; background:#222; color:#fff; border:1px solid #444; padding:4px; }
</style>
</head>
<body>
<div id="viewer">
  <div id="pages">
    <img src="pages/p-001.png" id="pageimg" alt="Tour book page">
  </div>
  <div class="controls">
    <button onclick="prev()">Prev</button>
    <span>
      <input type="number" id="jumpto" min="1" max="145" value="1" onchange="jump()">
      <span class="page-num"> / 145</span>
    </span>
    <button onclick="next()">Next</button>
  </div>
</div>
<div class="version">v0.9</div>
<script>
let current = 1;
const total = 145;
function pad(n) { return n.toString().padStart(3,'0'); }
function showPage() {
  document.getElementById('pageimg').src = 'pages/p-' + pad(current) + '.png';
  document.getElementById('jumpto').value = current;
}
function prev() { if (current > 1) { current--; showPage(); } }
function next() { if (current < total) { current++; showPage(); } }
function jump() {
  let n = parseInt(document.getElementById('jumpto').value);
  if (n >= 1 && n <= total) { current = n; showPage(); }
}
showPage();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
