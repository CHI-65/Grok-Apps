<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<title>P!NK NA 2026 – Digital Tour Book</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:system-ui; }
  #viewer { height:100vh; display:flex; flex-direction:column; }
  #pages { flex:1; overflow:auto; background:#222; }
  #pages img { width:100%; display:block; }
  .controls { background:#000; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }
  .controls button { background:#333; color:#fff; border:none; padding:8px 14px; border-radius:6px; }
  .page-num { font-size:14px; }
  .version { position:fixed; bottom:60px; right:12px; font-size:11px; opacity:.5; }
</style>
</head>
<body>
<div id="viewer">
  <div id="pages">
    <img src="pages/p-002.png" id="pageimg" alt="Tour book page">
  </div>
  <div class="controls">
    <button onclick="prev()">Prev</button>
    <span class="page-num" id="pagenum">Page 2</span>
    <button onclick="next()">Next</button>
  </div>
</div>
<div class="version">v0.8</div>
<script>
const pages = [
  { src: 'pages/p-002.png', label: 'Itinerary' },
  { src: 'pages/p-003.png', label: 'Itinerary continued' }
];
let current = 0;
function showPage() {
  document.getElementById('pageimg').src = pages[current].src;
  document.getElementById('pagenum').textContent = 'Page ' + (current + 2);
}
function prev() { if (current > 0) { current--; showPage(); } }
function next() { if (current < pages.length - 1) { current++; showPage(); } }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
