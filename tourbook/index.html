<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<link rel="manifest" href="manifest.webmanifest">
<title>P!NK NA 2026 – Digital Tour Book</title>
<style>
  body { margin:0; background:#eee; color:#111; font-family:Arial,Helvetica,sans-serif; }
  #cover { position:fixed; inset:0; background:#000 url('cover-page1.png') center/cover no-repeat; display:flex; align-items:flex-end; justify-content:center; padding-bottom:40px; z-index:100; }
  #cover button { padding:14px 28px; background:#fff; color:#e10600; border:none; border-radius:6px; font-weight:600; font-family:system-ui; }
  header { background:#111; color:#fff; padding:10px 16px; position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; font-family:system-ui; }
  .nav button { background:#333; color:#fff; border:none; padding:8px 12px; margin:0 4px; border-radius:6px; }
  .nav button.active { background:#e10600; }
  #banner { background:#e10600; color:#fff; padding:10px 16px; text-align:center; font-family:system-ui; display:none; }
  #banner button { background:#fff; color:#e10600; border:none; padding:6px 12px; border-radius:4px; margin-left:10px; font-weight:600; }
  #pageview { height:calc(100vh - 50px); overflow:hidden; background:#eee; position:relative; }
  #pageimg { width:100%; display:block; transition: transform 0.3s ease; }
  .controls { background:#111; color:#fff; padding:8px 16px; display:flex; justify-content:space-between; align-items:center; font-family:system-ui; }
  .page { width:100%; max-width:8.5in; margin:0 auto; background:#fff; min-height:calc(100vh - 50px); padding:12px 14px 40px; font-size:9px; line-height:1.15; }
  .header-banner { background:#000; color:#fff; text-align:center; font-weight:700; font-size:11px; letter-spacing:1px; padding:3px 0; margin-bottom:4px; }
  .header-row { display:flex; border:1.5px solid #000; margin-bottom:8px; }
  .header-left { flex:1; padding:4px 6px; font-weight:700; font-size:11px; text-align:center; border-right:1.5px solid #000; }
  .header-right { width:2.1in; text-align:center; font-size:8px; }
  .header-right .date { font-weight:700; font-size:9px; border-bottom:1px solid #000; padding:2px 0; }
  .section-title { text-align:center; font-weight:700; font-size:10px; margin:6px 0 2px; position:relative; }
  .section-title::before, .section-title::after { content:""; position:absolute; top:50%; width:28%; height:1px; background:#000; }
  .section-title::before { left:0; } .section-title::after { right:0; }
  .party-line { font-size:8.5px; margin:1px 0; }
  .hotel-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; margin:4px 0 6px; font-size:7.5px; }
  .party-label { font-weight:700; font-size:8px; text-align:center; border-bottom:1px solid #000; margin-bottom:2px; }
  .hotel-name { font-weight:700; text-align:center; }
  .schedule-box { border:1.5px solid #000; padding:3px 6px; font-size:7.5px; }
  .schedule-box .stitle { font-weight:700; text-align:center; font-size:9px; border-bottom:1px solid #000; margin-bottom:3px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; font-size:12px; }
  .cal-grid div { padding:6px 2px; border:1px solid #ddd; min-height:44px; cursor:pointer; }
  .cal-grid .dow { background:#333; color:#fff; font-weight:600; border:none; }
  .cal-grid .filled { background:#ffe6e6; font-weight:600; }
  .hidden { display:none !important; }
  .version { font-size:11px; opacity:.6; }
</style>
</head>
<body>
<div id="cover">
  <button onclick="enter()">Open Tour Book</button>
</div>
<div id="banner">New version available <button onclick="location.reload(true)">Refresh</button></div>
<header>
  <div>P!NK • 2026 <span class="version">v2.0</span></div>
  <div class="nav">
    <button class="active" onclick="showView('pages')">Pages</button>
    <button onclick="showView('calendar')">Calendar</button>
    <button onclick="location.reload(true)">Refresh</button>
  </div>
</header>
<div id="pages">
  <div id="pageview"><img id="pageimg" src="pages/p-002.png"></div>
  <div class="controls">
    <button onclick="prevPage()">Prev</button>
    <span id="pagenum">Page 2</span>
    <button onclick="nextPage()">Next</button>
  </div>
</div>
<div id="calendar" class="page hidden">
  <div style="text-align:center;font-weight:700;font-size:14px;margin-bottom:8px">NOVEMBER 2026</div>
  <div class="cal-grid" id="novCal"></div>
</div>
<div id="daypage" class="page hidden">
  <div id="sheet"></div>
  <div style="text-align:center;margin-top:16px"><button onclick="showView('calendar')" style="padding:10px 20px">Back to Calendar</button></div>
</div>
<script>
function enter() { document.getElementById('cover').style.display='none'; }

const CURRENT = '2.0';
fetch('https://chi-65.github.io/Grok-Apps/tourbook/index.html?v=' + Date.now())
  .then(r => r.text())
  .then(html => {
    const m = html.match(/v([0-9.]+)/);
    if (m && m[1] !== CURRENT) document.getElementById('banner').style.display = 'block';
  }).catch(()=>{});

let currentPage = 2;
const maxPage = 42;
let touchStartX = 0;
let isAnimating = false;
const img = document.getElementById('pageimg');

document.getElementById('pageview').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.getElementById('pageview').addEventListener('touchend', e => {
  if (isAnimating) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 60) turnPage(-1);
  if (dx < -60) turnPage(1);
});

function turnPage(dir) {
  const next = currentPage + dir;
  if (next < 2 || next > maxPage) return;
  isAnimating = true;
  img.style.transition = 'transform 0.35s ease';
  img.style.transform = `translateX(${dir > 0 ? '-100%' : '100%'})`;
  setTimeout(() => {
    currentPage = next;
    img.src = 'pages/p-' + String(currentPage).padStart(3,'0') + '.png';
    img.style.transition = 'none';
    img.style.transform = `translateX(${dir > 0 ? '100%' : '-100%'})`;
    setTimeout(() => {
      img.style.transition = 'transform 0.35s ease';
      img.style.transform = 'translateX(0)';
      document.getElementById('pagenum').textContent = 'Page ' + currentPage;
      setTimeout(() => { isAnimating = false; }, 350);
    }, 20);
  }, 350);
}
function prevPage() { turnPage(-1); }
function nextPage() { turnPage(1); }

const filled = {
  '2026-11-10': {
    banner: 'DAY OFF',
    title: 'DAY OFF',
    date: 'TUESDAY, NOVEMBER 10, 2026',
    city: 'WASHINGTON, DC',
    tz: 'EST',
    notes: ['A PARTY  DAY OFF IN WASHINGTON', 'B PARTY  DAY OFF IN WASHINGTON', 'C PARTY  DAY OFF IN WASHINGTON'],
    hotels: {
      a: { name:'THE WILLARD', addr:'1401 PENNSYLVANIA AVE NW\nWASHINGTON, DC 20004', tel:'(202) 628-9100', onsite:'AVAILABLE', bars:'1', rest:'1', health:'FITNESS CENTER', windows:'NOT OPENABLE', airport:'5.2 MILES', venue:'1.1 MILES' },
      b: { name:'HOTEL WASHINGTON', addr:'515 15TH ST NW\nWASHINGTON, DC 20004', tel:'(202) 661-2400', onsite:'AVAILABLE', bars:'1', rest:'1', health:'FITNESS CENTER', windows:'OPENABLE', airport:'5.0 MILES', venue:'0.8 MILES' },
      c: { name:'HAMPTON INN', addr:'1729 H ST NW\nWASHINGTON, DC 20006', tel:'(202) 296-1006', onsite:'AVAILABLE', bars:'0', rest:'0', health:'FITNESS CENTER', windows:'NOT OPENABLE', airport:'5.4 MILES', venue:'1.3 MILES' }
    },
    venue: 'NATIONALS PARK\n1500 SOUTH CAPITOL ST SE\nWASHINGTON, DC 20003',
    schedule: 'Day off. Load-in tomorrow.',
    tonight: ['A PARTY  OVERNIGHT IN WASHINGTON', 'B PARTY  OVERNIGHT IN WASHINGTON', 'C PARTY  OVERNIGHT IN WASHINGTON']
  }
};

function buildCal() {
  const cal = document.getElementById('novCal');
  let html = '<div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>';
  for (let d=1; d<=30; d++) {
    const key = `2026-11-${String(d).padStart(2,'0')}`;
    const label = filled[key] ? filled[key].banner : '';
    html += `<div class="${filled[key]?'filled':''}" onclick="openDay('${key}')">${d}${label?'<br>'+label:''}</div>`;
  }
  cal.innerHTML = html;
}

function openDay(key) {
  const d = filled[key] || {};
  const h = d.hotels || {a:{},b:{},c:{}};
  document.getElementById('sheet').innerHTML = `
    <div class="header-banner">${d.banner||'DAY'}</div>
    <div class="header-row">
      <div class="header-left">${d.title||''}</div>
      <div class="header-right">
        <div class="date">${d.date||''}</div>
        <div>${d.city||''}</div>
        <div>${d.tz||''}</div>
      </div>
    </div>
    <div class="section-title">DAY NOTES</div>
    ${(d.notes||[]).map(n=>`<div class="party-line">${n}</div>`).join('')}
    <div class="section-title">HOTEL</div>
    <div class="hotel-grid">
      ${['a','b','c'].map(p=>`
        <div>
          <div class="party-label">${p.toUpperCase()} PARTY</div>
          <div class="hotel-name">${h[p].name||''}</div>
          <div style="text-align:center;white-space:pre-line">${h[p].addr||''}</div>
          <div>TEL ${h[p].tel||''}</div>
          <div>ON-SITE ${h[p].onsite||''}</div>
          <div>BARS ${h[p].bars||''}</div>
          <div>REST ${h[p].rest||''}</div>
          <div>HEALTH ${h[p].health||''}</div>
          <div>WINDOWS ${h[p].windows||''}</div>
          <div>TO AIRPORT ${h[p].airport||''}</div>
          <div>TO VENUE ${h[p].venue||''}</div>
        </div>`).join('')}
    </div>
    <div class="section-title">PRODUCTION</div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:8px">
      <div><div style="font-weight:700">VENUE</div><div style="white-space:pre-line">${d.venue||''}</div></div>
      <div class="schedule-box"><div class="stitle">SCHEDULE</div><div style="white-space:pre-line">${d.schedule||''}</div></div>
    </div>
    <div class="section-title">TONIGHT</div>
    ${(d.tonight||[]).map(n=>`<div class="party-line">${n}</div>`).join('')}
  `;
  showView('daypage');
}

function showView(id) {
  document.getElementById('pages').classList.add('hidden');
  document.getElementById('calendar').classList.add('hidden');
  document.getElementById('daypage').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if (id === 'pages' || id === 'calendar') event.target.classList.add('active');
}

buildCal();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
