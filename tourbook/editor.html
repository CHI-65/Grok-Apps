<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest-editor.webmanifest">
<link rel="icon" href="icon-master-192.png">
<title>P!NK Tour Book – Editor</title>
<style>
  body { margin:0; font-family:system-ui; background:#111; color:#fff; }
  #login { position:fixed; inset:0; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #login input { padding:12px; font-size:16px; width:220px; margin:8px; border-radius:6px; border:none; }
  #login button { padding:12px 24px; background:#e10600; color:#fff; border:none; border-radius:6px; font-weight:600; }
  header { background:#000; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }
  .nav button { background:#333; color:#fff; border:none; padding:8px 12px; margin:0 4px; border-radius:6px; }
  .content { padding:16px; background:#fff; color:#111; min-height:calc(100vh - 50px); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; font-size:12px; }
  .cal-grid div { padding:6px 2px; border:1px solid #ddd; min-height:44px; cursor:pointer; }
  .cal-grid .dow { background:#333; color:#fff; }
  .cal-grid .filled { background:#ffe6e6; font-weight:600; }
  .daysheet h2 { text-align:center; }
  .field { margin:10px 0; }
  .field label { font-weight:700; font-size:12px; display:block; }
  .field input, .field textarea { width:100%; padding:8px; font-size:14px; border:1px solid #ccc; border-radius:4px; }
  .hidden { display:none !important; }
  .edit-btn { background:#e10600; color:#fff; border:none; padding:10px 20px; border-radius:6px; margin-top:12px; }
</style>
</head>
<body>
<div id="login">
  <h2>Editor Access</h2>
  <input type="password" id="pw" placeholder="Password">
  <button onclick="checkPw()">Unlock</button>
  <div id="err" style="color:#f66;margin-top:8px"></div>
</div>
<div id="app" class="hidden">
  <header>
    <div>Editor • v1.0</div>
    <div class="nav">
      <button onclick="show('calendar')">Calendar</button>
      <button onclick="logout()">Lock</button>
    </div>
  </header>
  <div id="calendar" class="content">
    <div style="text-align:center;font-weight:700">NOVEMBER 2026</div>
    <div class="cal-grid" id="novCal"></div>
  </div>
  <div id="daypage" class="content daysheet hidden">
    <h2 id="daytitle"></h2>
    <div id="dayform"></div>
    <button class="edit-btn" id="editBtn" onclick="toggleEdit()">Edit</button>
    <button class="edit-btn" id="saveBtn" style="display:none;background:#060" onclick="saveDay()">Save</button>
    <div style="margin-top:16px"><button onclick="show('calendar')">Back</button></div>
  </div>
</div>
<script>
const PASS = 'tour2026';
function checkPw() {
  if (document.getElementById('pw').value === PASS) {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    buildCal();
  } else {
    document.getElementById('err').textContent = 'Wrong password';
  }
}
function logout() {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('pw').value = '';
}

const data = {
  '2026-11-10': { status: 'Today • Day Off', hotels: 'Same as Nov 8', venue: '—', schedule: 'Day off. Load-in tomorrow.', notes: '' },
  '2026-11-11': { status: 'Show • Nationals Park', hotels: 'Same as Nov 8', venue: 'Nationals Park', schedule: 'Doors 5:00 PM • Curfew 10:30 PM', notes: '' }
};

function buildCal() {
  const cal = document.getElementById('novCal');
  let html = '<div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>';
  for (let d = 1; d <= 30; d++) {
    const key = `2026-11-${String(d).padStart(2,'0')}`;
    const label = data[key] ? data[key].status.split('•')[0].trim() : '';
    html += `<div class="${data[key]?'filled':''}" onclick="openDay('${key}')">${d}${label?'<br>'+label:''}</div>`;
  }
  cal.innerHTML = html;
}

let currentKey = null;
let editing = false;
function openDay(key) {
  currentKey = key;
  editing = false;
  const date = new Date(key + 'T12:00:00');
  document.getElementById('daytitle').textContent = date.toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
  renderForm();
  show('daypage');
}
function renderForm() {
  const d = data[currentKey] || { status:'', hotels:'', venue:'', schedule:'', notes:'' };
  const ro = editing ? '' : 'readonly';
  document.getElementById('dayform').innerHTML = `
    <div class="field"><label>STATUS</label><input ${ro} id="fstatus" value="${d.status||''}"></div>
    <div class="field"><label>HOTELS</label><textarea ${ro} id="fhotels" rows="3">${d.hotels||''}</textarea></div>
    <div class="field"><label>VENUE</label><textarea ${ro} id="fvenue" rows="2">${d.venue||''}</textarea></div>
    <div class="field"><label>SCHEDULE</label><textarea ${ro} id="fschedule" rows="3">${d.schedule||''}</textarea></div>
    <div class="field"><label>NOTES</label><textarea ${ro} id="fnotes" rows="2">${d.notes||''}</textarea></div>
  `;
  document.getElementById('editBtn').style.display = editing ? 'none' : 'inline-block';
  document.getElementById('saveBtn').style.display = editing ? 'inline-block' : 'none';
}
function toggleEdit() {
  editing = true;
  renderForm();
}
function saveDay() {
  data[currentKey] = {
    status: document.getElementById('fstatus').value,
    hotels: document.getElementById('fhotels').value,
    venue: document.getElementById('fvenue').value,
    schedule: document.getElementById('fschedule').value,
    notes: document.getElementById('fnotes').value
  };
  editing = false;
  renderForm();
  alert('Saved (local only for now). Next step: push to shared JSON so crew app updates.');
}
function show(id) {
  document.getElementById('calendar').classList.add('hidden');
  document.getElementById('daypage').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}
</script>
</body>
</html>
